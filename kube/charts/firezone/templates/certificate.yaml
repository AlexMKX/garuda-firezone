apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-tls
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "firezone.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.name }}-tls
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d
  dnsNames:
    - {{ .Values.serverFqdn | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tlsClusterIssuer | quote }}
